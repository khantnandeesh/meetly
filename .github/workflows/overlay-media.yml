# E-media's browser runs (packages/overlay/media/browser), on a GitHub runner rather than a
# shared development machine: the source at the SPEC's 1280×720 (where Chromium's VP8 encoder
# uses 4 threads), the player's glass-to-glass and decode checks, the clap tests, light viewers
# and the slow decoder. See packages/overlay/media/README.md.
#
# This job measures; it does not gate. Each scenario prints its checks and numbers, and the job
# summary and the uploaded log hold them. It runs when media's code or this file changes on the
# overlay-media branch, and by hand.
name: Overlay media (browser runs)

on:
  push:
    branches:
      - overlay-media
    paths:
      - "packages/overlay/media/**"
      - ".github/workflows/overlay-media.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-media-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  media:
    name: Media browser runs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # As ci.yml's e2e job: Playwright outside the project, found through NODE_PATH.
      - name: Install Playwright ${{ env.PLAYWRIGHT_VERSION }} and Chromium
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Run the scenarios
        run: |
          # The runner starts bash with -e and pipefail; a scenario whose checks fail must not stop the rest.
          set -u +e +o pipefail
          run() {
            echo "::group::$1 $2"
            node --experimental-transform-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning \
              --import ./test/register.mjs packages/overlay/media/browser/run.ts "$1" "$2" 2>&1 | tee -a media-runs.log
            echo "exit ${PIPESTATUS[0]} ($1 $2)" | tee -a media-runs.log
            echo "::endgroup::"
          }
          echo "runner: $(nproc) cores; load $(cut -d' ' -f1-3 /proc/loadavg)" | tee media-runs.log
          run m1 '{"seconds":60}'
          run m1 '{"seconds":60,"decode":false}'
          run m1 '{"seconds":60,"input":"camera"}'
          run m1 '{"seconds":60,"width":1272}'
          run deps '{}'
          run m3 '{"seconds":300,"input":"camera"}'
          run m3 '{"seconds":30,"input":"camera","audio":true}'
          run clap '{}'
          run av '{}'
          run m5 '{"seconds":12,"width":640,"height":360,"bitrateKbps":600}'
          run m6 '{}'
          # The source holding its bitrate whatever the picture (media/rateControl.ts).
          run rate '{"content":"busy","seconds":30}'
          run rate '{"content":"fine","seconds":30}'
          run rate '{"content":"noise","seconds":30}'
          run rate '{"content":"camera","seconds":30}'
          run rate '{"content":"stage","seconds":30}'
          run rate '{"content":"flash","seconds":30,"width":640,"height":360,"bitrateKbps":600}'
          {
            echo '### Media browser runs'
            echo '```'
            grep -E '^(runner|## |  ok|  FAIL|exit )' media-runs.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: media-runs
          path: media-runs.log

  # The same media through the integrated engine: overlay-integration's composition root, real
  # transport with NACK, the harness's impairment shim, the package's coordinator, with this
  # branch's packages/overlay/media in place of the one merged there.
  integrated:
    name: Media through the integrated engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: media
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: overlay-integration
          path: int
          persist-credentials: false
      - name: This branch's media in the integrated engine
        run: |
          set -euo pipefail
          echo "overlay-integration at $(git -C int rev-parse --short HEAD), media from $(git -C media rev-parse --short HEAD)"
          rm -rf int/packages/overlay/media
          cp -r media/packages/overlay/media int/packages/overlay/media
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: int/package-lock.json
      - run: npm ci
        working-directory: int
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright ${{ env.PLAYWRIGHT_VERSION }} and Chromium
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Run
        working-directory: int
        run: |
          # Measures, does not gate: a scenario that fails its numbers must not stop the rest.
          set -u +e +o pipefail
          run() {
            echo "::group::$1"
            node --experimental-transform-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning \
              --import ./test/register.mjs packages/overlay/media/browser/engine-run.ts "$1" 2>&1 | tee -a engine-runs.log
            echo "exit ${PIPESTATUS[0]} ($1)" | tee -a engine-runs.log
            echo "::endgroup::"
          }
          echo "runner: $(nproc) cores; load $(cut -d' ' -f1-3 /proc/loadavg)" | tee engine-runs.log
          run '{"program":"busy","width":1280,"height":720,"bitrateKbps":1200,"seconds":40}'
          run '{"program":"noise","width":1280,"height":720,"bitrateKbps":1200,"seconds":40}'
          run '{"program":"busy","width":1280,"height":720,"bitrateKbps":1200,"seconds":40,"profile":"home"}'
          run '{"program":"av","seconds":30}'
          run '{"program":"av","seconds":30,"profile":"home"}'
          {
            echo '### Media through the integrated engine'
            echo '```'
            grep -E '^(runner|busy|noise|av|exit )' engine-runs.log
            grep -E '^source: ' engine-runs.log | cut -c1-200
            grep -oE '^viewer [0-9]+: \{"flashes":[0-9]+,"clicks":[0-9]+,"skewMs":\{[^}]*\}|"glassToGlassMs":\{[^}]*\}|"videoKbps":\{[^}]*\},"rxKbps":\{[^}]*\}' engine-runs.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: engine-runs
          path: int/engine-runs.log
