# E-media's browser runs (packages/overlay/media/browser), on a GitHub runner rather than a
# shared development machine: the source at the SPEC's 1280×720 (where Chromium's VP8 encoder
# uses 4 threads), the player's glass-to-glass and decode checks, the clap tests, light viewers
# and the slow decoder. See packages/overlay/media/README.md.
#
# This job measures; it does not gate. Each scenario prints its checks and numbers, and the job
# summary and the uploaded log hold them. It runs when media's code or this file changes on the
# overlay-media branch, and by hand.
name: Overlay media (browser runs)

on:
  push:
    branches:
      - overlay-media
    paths:
      - "packages/overlay/media/**"
      - ".github/workflows/overlay-media.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-media-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  media:
    name: Media browser runs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # As ci.yml's e2e job: Playwright outside the project, found through NODE_PATH.
      - name: Install Playwright ${{ env.PLAYWRIGHT_VERSION }} and Chromium
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Run the scenarios
        run: |
          # The runner starts bash with -e and pipefail; a scenario whose checks fail must not stop the rest.
          set -u +e +o pipefail
          run() {
            echo "::group::$1 $2"
            node --experimental-transform-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning \
              --import ./test/register.mjs packages/overlay/media/browser/run.ts "$1" "$2" 2>&1 | tee -a media-runs.log
            echo "exit ${PIPESTATUS[0]} ($1 $2)" | tee -a media-runs.log
            echo "::endgroup::"
          }
          echo "runner: $(nproc) cores; load $(cut -d' ' -f1-3 /proc/loadavg)" | tee media-runs.log
          run m1 '{"seconds":60}'
          run m1 '{"seconds":60,"decode":false}'
          run m1 '{"seconds":60,"input":"camera"}'
          run m1 '{"seconds":60,"width":1272}'
          run deps '{}'
          run m3 '{"seconds":300,"input":"camera"}'
          run m3 '{"seconds":30,"input":"camera","audio":true}'
          run clap '{}'
          run av '{}'
          run m5 '{"seconds":12,"width":640,"height":360,"bitrateKbps":600}'
          run m6 '{}'
          {
            echo '### Media browser runs'
            echo '```'
            grep -E '^(runner|## |  ok|  FAIL|exit )' media-runs.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: media-runs
          path: media-runs.log
